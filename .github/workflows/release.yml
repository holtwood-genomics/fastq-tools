name: Release

# 在 v* tag 上构建 portable Linux 二进制（x86_64 + aarch64）。
# 先校验 tag、CMake 版本与 CHANGELOG 段；两个架构并行原生构建，产物上传为
# workflow artifact，另有 test job 运行完整测试。全部门禁通过后才由 publish job
# 创建或更新 draft Release；维护者核对 CHANGELOG、产物与 smoke test 后手动发布。
# 已正式发布的 Release 不允许被重跑 workflow 覆盖。容器内 musl 静态构建仍可用
# scripts/ci/release-build。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CONAN_VERSION: '2.27.1'
  CMAKE_VERSION: '4.3.4'
  LLVM_VERSION: '21'

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify tag, CMake version and CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be vMAJOR.MINOR.PATCH: ${tag}" >&2
            exit 1
          fi

          cmake_version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' CMakeLists.txt | head -n1)"
          if [[ -z "$cmake_version" ]]; then
            echo "::error::cannot read project version from CMakeLists.txt" >&2
            exit 1
          fi
          if [[ "$version" != "$cmake_version" ]]; then
            echo "::error::tag ${tag} does not match CMake project version ${cmake_version}" >&2
            exit 1
          fi

          if ! grep -Eq "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          section="$(awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "${section//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md section for ${version} is empty" >&2
            exit 1
          fi

          release_error="$(mktemp)"
          trap 'rm -f "$release_error"' EXIT
          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          if is_draft="$(gh api "$endpoint" --jq '.draft' 2>"$release_error")"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release ${tag} is already published; refusing to mutate it" >&2
              exit 1
            fi
            echo "release metadata ok: ${tag} (existing draft will be updated)"
          elif grep -Fq 'HTTP 404' "$release_error"; then
            echo "release metadata ok: ${tag} (draft will be created)"
          else
            cat "$release_error" >&2
            echo "::error::failed to query existing release ${tag}" >&2
            exit 1
          fi

  linux-x86_64:
    needs: validate-release
    name: Linux x86_64
    # 钉在 22.04（glibc 2.35）构建 portable 产物；runner 升级到 24.04
    # 会把二进制最低 glibc 抬到 2.39，导致 22.04 目标机无法启动。
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          # runner.arch 区分 X64/ARM64：两者 package_id 不同，不能共用缓存主键
          key: ${{ runner.os }}-${{ runner.arch }}-conan-clang-release-${{ hashFiles('build-config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-conan-clang-
            ${{ runner.os }}-${{ runner.arch }}-conan-

      - name: Setup build toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: clang
          extra-apt-packages: patchelf

      - name: Build portable Release
        run: ./scripts/core/build --compiler clang --type Release --cpu-baseline portable --no-lto

      - name: Package binary
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./scripts/ci/package-binary build/clang-release/FastQTools \
            "FastQTools-${version}-linux-x86_64" dist

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/*
          retention-days: 7

  linux-aarch64:
    needs: validate-release
    name: Linux aarch64
    # 与 x86 保持同一 glibc 基线（22.04 / 2.35）。不要改成 24.04-arm，
    # 否则 ARM 产物会要求 GLIBC_2.39，在 22.04 服务器上无法运行。
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-${{ runner.arch }}-conan-clang-release-${{ hashFiles('build-config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-conan-clang-
            ${{ runner.os }}-${{ runner.arch }}-conan-

      - name: Setup build toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: clang
          extra-apt-packages: patchelf

      # 显式 --build-dir 绕过 clang preset：该 preset 强制 -stdlib=libc++，
      # 而 ARM 构建统一使用系统 libstdc++（见 profile-clang-arm64）。
      - name: Build portable Release
        run: >-
          ./scripts/core/build --compiler clang --type Release
          --build-dir build/clang-release --cpu-baseline portable --no-lto

      - name: Package binary
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./scripts/ci/package-binary build/clang-release/FastQTools \
            "FastQTools-${version}-linux-aarch64" dist

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-linux-aarch64
          path: dist/*
          retention-days: 7

  test:
    needs: validate-release
    name: Test
    # 发布门禁：与 linux-x86_64 相同的构建配置先跑完整测试套件；
    # publish 依赖本 job，测试失败则不会创建 Release。
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-${{ runner.arch }}-conan-clang-release-${{ hashFiles('build-config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-conan-clang-
            ${{ runner.os }}-${{ runner.arch }}-conan-

      - name: Setup build toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: clang

      - name: Build with tests
        run: ./scripts/core/build --compiler clang --type Release --cpu-baseline portable --no-lto

      - name: Run tests
        run: ./scripts/core/test --build-dir build/clang-release --timeout 180

  publish:
    name: Publish release draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-release, test, linux-x86_64, linux-aarch64]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="FastQTools ${tag}

          Linux portable tarballs (no -march) for x86_64 and aarch64. Each tarball bundles the
          runtime libraries (oneTBB/hwloc/libc++ as applicable). See CHANGELOG.md for details."

          release_error="$(mktemp)"
          trap 'rm -f "$release_error"' EXIT
          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          if is_draft="$(gh api "$endpoint" --jq '.draft' 2>"$release_error")"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release ${tag} is already published; refusing to mutate it" >&2
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
            echo "::notice::updated existing draft release ${tag}"
          elif grep -Fq 'HTTP 404' "$release_error"; then
            gh release create "$tag" dist/* \
              --draft \
              --title "FastQTools ${tag}" \
              --notes "${notes}"
            echo "::notice::created draft release ${tag}"
          else
            cat "$release_error" >&2
            echo "::error::failed to query existing release ${tag}" >&2
            exit 1
          fi
